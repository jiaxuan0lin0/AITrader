paths:
  processed_dir: /data/jiaxuanLin/AItrader/data/datasets/processed
  feature_registry_path: /data/jiaxuanLin/AItrader/data/datasets/features/feature_registry.json
  evaluation_dir: /data/jiaxuanLin/AItrader/data/datasets/factors/evaluation/final
  model_root: /data/jiaxuanLin/AItrader/data/experiments/msgca/20260601_loss_ablation/runs/r030_topk005_vwap
data:
  lookback: 60
  primary_label: label_next_open_return
  secondary_label: label_next_vwap_return
  strict_lookback: true
  fast_loader: true
  use_polars: true
  train_start: '2019-01-01'
  train_end: '2025-12-31'
  validation_start: '2026-01-01'
  validation_end: '2026-05-20'
  holdout_start: '2026-05-21'
  holdout_end: '2026-05-31'
  smoke_features: []
  price_columns:
  - open
  - high
  - low
  - close
  - vwap
  - volume
  - amount
  - mf_net_amount_ratio
  - mf_main_net_amount_ratio
  - mf_small_order_pressure
  text_prefixes:
  - news_
  - market_news
  fundamental_prefixes:
  - metric_
  - mf_
  - alpha158_
model:
  hidden_dim: 48
  n_heads: 4
  dropout: 0.1
  price_layers: 1
  fusion_layers: 1
  factor_encoder: factor_aware
  factor_layers: 1
  factor_group_layers: 1
  factor_group_prototypes: 2
  factor_group_source: selected_blocks
  factor_gate_activation: softmax
  max_price_variables: 256
  max_text_features: 512
  max_fundamental_features: 2048
  enable_price: true
  enable_news: true
  enable_fundamental: true
  use_gate: true
  use_cross_attention: true
  use_factor_gate: true
train:
  seed: 2026
  epochs: 20
  batch_days: 1
  final_validate: true
  validate_each_epoch: true
  validation_interval: 1
  max_pairs_per_day: 4096
  learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true
  competition_validate: true
  competition_window_days: 10
  competition_recent_window_count: 5
  best_checkpoint_metric: competition_score
  best_checkpoint_mode: max
  rank_loss_weight: 1.0
  return_loss_weight: 0.3
  direction_loss_weight: 0.05
  topk_return_loss_weight: 0.05
  return_secondary_weight: 1.0
  topk_secondary_weight: 1.0
  topk_return_k: 20
  topk_return_mode: soft_equal_topk
  topk_temperature: 0.1
  gate_entropy_weight: 0.001
  time_weight_bins:
  - start: '2019-01-01'
    end: '2022-12-31'
    weight: 0.5
  - start: '2023-01-01'
    end: '2023-12-31'
    weight: 0.8
  - start: '2024-01-01'
    end: '2024-12-31'
    weight: 1.2
  - start: '2025-01-01'
    end: '2025-12-31'
    weight: 1.6
  normalize_time_weights: false
strategy:
  initial_cash: 1000000.0
  top_n: 20
  daily_replace_k: 5
  fee_rate: 0.0003
  slippage_rate: 0.0005
  full_investment: true
  score_variant: weighted
  score_weight_y: 0.0
  score_weight_return: 1.0
  score_weight_direction: 0.0
  score_weight_cap: 0.5
  cap_min_pct: 0.5
  cap_bonus: 0.0
  exclude_st: true
  exclude_bj: true
