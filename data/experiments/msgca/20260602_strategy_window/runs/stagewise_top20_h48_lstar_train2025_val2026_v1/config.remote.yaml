paths:
  processed_dir: /data/jxlin/AItrader/data/datasets/processed
  feature_registry_path: /data/jxlin/AItrader/data/datasets/features/feature_registry.json
  evaluation_dir: /data/jxlin/AItrader/data/datasets/factors/evaluation/final
  model_root: /data/jxlin/AItrader/data/experiments/msgca/20260602_strategy_window/runs/stagewise_top20_h48_lstar_train2025_val2026_v1
data:
  lookback: 60
  primary_label: label_next_open_return
  secondary_label: label_next_vwap_return
  strict_lookback: true
  fast_loader: true
  use_polars: true
  price_window_cache: memory
  price_window_cache_dir: null
  train_start: '2019-01-01'
  train_end: '2025-12-31'
  validation_start: '2026-01-01'
  validation_end: '2026-05-01'
  holdout_start: '2026-05-02'
  holdout_end: '2026-06-01'
  smoke_features: []
  price_columns:
  - open
  - high
  - low
  - close
  - vwap
  - volume
  - amount
  - mf_net_amount_ratio
  - mf_main_net_amount_ratio
  - mf_small_order_pressure
  text_prefixes:
  - news_
  - market_news
  fundamental_prefixes:
  - metric_
  - mf_
  - alpha158_
model:
  hidden_dim: 48
  n_heads: 4
  dropout: 0.1
  price_layers: 1
  fusion_layers: 1
  factor_encoder: factor_aware
  factor_layers: 1
  factor_group_layers: 1
  factor_group_prototypes: 2
  factor_group_source: selected_blocks
  factor_gate_activation: softmax
  max_price_variables: 256
  max_text_features: 512
  max_fundamental_features: 2048
  enable_price: true
  enable_news: true
  enable_fundamental: true
  use_gate: true
  use_cross_attention: true
  use_factor_gate: true
train:
  seed: 2028
  epochs: 24
  batch_days: 1
  final_validate: true
  validate_each_epoch: true
  validation_interval: 1
  max_pairs_per_day: 4096
  learning_rate: 0.0001
  weight_decay: 0.0001
  amp: true
  dataloader_workers: 4
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: true
  competition_validate: true
  competition_window_days: 10
  competition_recent_window_count: 10
  best_checkpoint_metric: competition_score
  best_checkpoint_mode: max
  save_epoch_checkpoints: false
  early_stop_min_epochs: 8
  early_stop_patience: 8
  restore_best_checkpoint: true
  validation_score_col: final_score
  validation_score_variant: final_score
  rank_loss_weight: 0.3
  return_loss_weight: 0.1
  direction_loss_weight: 0.03
  topk_return_loss_weight: 0.12
  return_secondary_weight: 0.0
  topk_secondary_weight: 0.0
  topk_return_k: 20
  topk_return_mode: soft_equal_topk
  topk_temperature: 0.1
  gate_entropy_weight: 0.001
  rank_score_field: final_score
  topk_score_field: final_score
  aux_topk_return_losses:
  - k: 10
    weight: 0.03
    score_field: final_score
  - k: 40
    weight: 0.02
    score_field: final_score
  strategy_window_loss_weight: 0.0
  strategy_window_pool_start: '2026-01-01'
  strategy_window_pool_end: '2026-05-20'
  strategy_window_days: 10
  strategy_window_samples_per_epoch: 0
  strategy_window_label: label_next_open_return
  strategy_window_score_field: final_score
  strategy_window_top_n: 20
  strategy_window_mode: soft_equal_topk
  strategy_window_temperature: 0.1
  strategy_window_return_weight: 0.2
  strategy_window_excess_weight: 1.0
  strategy_window_downside_weight: 0.2
  strategy_window_seed: 42026
  stages:
  - name: final_top20_lstar_val2026
    epochs: 10
    min_epochs: 4
    patience: 4
    trainable: encoder_and_final
    validation_interval: 1
    validation_score_col: final_score
    validation_score_variant: final_score
    best_checkpoint_metric: competition_score
    best_checkpoint_mode: max
    rank_loss_weight: 0.25
    return_loss_weight: 0.0
    direction_loss_weight: 0.0
    topk_return_loss_weight: 0.24
    topk_return_k: 20
    rank_score_field: final_score
    topk_score_field: final_score
    aux_topk_return_losses:
    - k: 10
      weight: 0.06
      score_field: final_score
    - k: 40
      weight: 0.08
      score_field: final_score
    strategy_window_loss_weight: 0.0
    strategy_window_samples_per_epoch: 0
    consistency_loss_weight: 0.0
  - name: joint_lstar_consistency_val2026
    epochs: 14
    min_epochs: 5
    patience: 5
    trainable: all
    validation_interval: 1
    validation_score_col: final_score
    validation_score_variant: final_score
    best_checkpoint_metric: competition_score
    best_checkpoint_mode: max
    rank_loss_weight: 0.2
    return_loss_weight: 0.06
    return_loss_type: huber
    return_huber_delta: 0.02
    return_secondary_weight: 0.2
    direction_loss_weight: 0.02
    direction_label_epsilon: 0.003
    topk_return_loss_weight: 0.18
    topk_return_k: 20
    rank_score_field: final_score
    topk_score_field: final_score
    aux_topk_return_losses:
    - k: 10
      weight: 0.05
      score_field: final_score
    - k: 40
      weight: 0.06
      score_field: final_score
    strategy_window_loss_weight: 0.0
    strategy_window_samples_per_epoch: 0
    consistency_loss_weight: 0.05
    consistency_score_field: final_score
    consistency_topk_k: 40
    consistency_temperature: 0.1
    consistency_return_weight: 0.7
    consistency_direction_weight: 0.3
  time_weight_bins:
  - start: '2019-01-01'
    end: '2022-12-31'
    weight: 0.55
  - start: '2023-01-01'
    end: '2023-12-31'
    weight: 0.8
  - start: '2024-01-01'
    end: '2024-12-31'
    weight: 1.15
  - start: '2025-01-01'
    end: '2025-12-31'
    weight: 1.65
  normalize_time_weights: true
  return_loss_type: huber
  return_huber_delta: 0.02
  direction_label_epsilon: 0.003
  consistency_loss_weight: 0.0
  consistency_score_field: final_score
  consistency_topk_k: 40
  consistency_temperature: 0.1
  consistency_return_weight: 0.7
  consistency_direction_weight: 0.3
strategy:
  initial_cash: 1000000.0
  top_n: 20
  daily_replace_k: 5
  fee_rate: 0.0003
  slippage_rate: 0.0005
  full_investment: true
  score_variant: final_score
  score_weight_y: 1.0
  score_weight_return: 0.0
  score_weight_direction: 0.0
  score_weight_cap: 0.0
  cap_min_pct: 0.0
  cap_bonus: 0.0
  exclude_st: true
  exclude_bj: true
