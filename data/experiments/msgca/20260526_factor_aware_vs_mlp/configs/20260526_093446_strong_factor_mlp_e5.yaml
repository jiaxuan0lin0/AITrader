data:
  fast_loader: true
  fundamental_prefixes:
  - metric_
  - mf_
  - alpha158_
  holdout_start: '2026-01-01'
  lookback: 60
  price_columns:
  - open
  - high
  - low
  - close
  - vwap
  - volume
  - amount
  - mf_net_amount_ratio
  - mf_main_net_amount_ratio
  - mf_small_order_pressure
  primary_label: label_next_open_return
  secondary_label: label_next_vwap_return
  smoke_features:
  - open
  - high
  - low
  - close_x
  - amount
  - turnover_rate
  - volume_ratio
  - pe_ttm
  - pb
  - total_mv
  - circ_mv
  - net_mf_amount
  - market_news_count
  - news_count
  strict_lookback: true
  text_prefixes:
  - news_
  - market_news
  train_end: '2025-09-30'
  train_start: '2019-01-01'
  use_polars: true
  validation_end: '2025-12-31'
  validation_start: '2025-10-01'
model:
  dropout: 0.1
  enable_fundamental: true
  enable_news: true
  enable_price: true
  factor_encoder: simple
  factor_group_layers: 1
  factor_group_source: selected_blocks
  factor_layers: 2
  fusion_layers: 1
  hidden_dim: 64
  n_heads: 4
  price_layers: 2
  use_cross_attention: true
  use_factor_gate: true
  use_gate: true
paths:
  evaluation_dir: /data/jiaxuanLin/AItrader/data/datasets/factors/evaluation/select_20160105_20250930_slice
  feature_registry_path: /data/jiaxuanLin/AItrader/data/datasets/features/feature_registry.json
  model_root: /data/jiaxuanLin/AItrader/data/experiments/msgca/20260526_factor_aware_vs_mlp/runs/20260526_093446_strong_factor_mlp_e5
  processed_dir: /data/jiaxuanLin/AItrader/data/datasets/processed
strategy:
  daily_replace_k: 3
  fee_rate: 0.0003
  full_investment: true
  initial_cash: 1000000.0
  slippage_rate: 0.0005
  top_n: 20
train:
  amp: true
  batch_days: 1
  direction_loss_weight: 0.05
  epochs: 5
  final_validate: true
  gate_entropy_weight: 0.001
  learning_rate: 0.0001
  max_pairs_per_day: 4096
  rank_loss_weight: 1.0
  return_loss_weight: 0.1
  seed: 2026
  topk_return_loss_weight: 0.02
  topk_temperature: 0.1
  validate_each_epoch: false
  validation_interval: 0
  weight_decay: 0.0001
